name: Build Android APK (Godot 4)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-android:
    name: Export Godot 4 Android APK (>100MB)
    runs-on: ubuntu-latest

    env:
      GODOT_VERSION: "4.2.2"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Pre-Installed Android SDK & Build Tools
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Download & Install Godot 4.2.2 + Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -rf Godot_v${GODOT_VERSION}-stable* templates

      - name: Generate Debug Keystore & Configure Godot Android Settings
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore debug.keystore -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          python3 - << 'PYEOF'
          import os, pathlib

          sdk_path = os.environ.get("ANDROID_HOME", "/usr/local/lib/android/sdk")
          keystore_path = str(pathlib.Path("debug.keystore").resolve())
          cfg_dir = pathlib.Path.home() / ".config" / "godot"
          cfg_dir.mkdir(parents=True, exist_ok=True)

          content = (
              '[gd_resource type="EditorSettings" format=3]\n\n'
              '[resource]\n'
              f'export/android/android_sdk_path = "{sdk_path}"\n'
              f'export/android/debug_keystore = "{keystore_path}"\n'
              'export/android/debug_keystore_user = "androiddebugkey"\n'
              'export/android/debug_keystore_pass = "android"\n'
          )
          (cfg_dir / "editor_settings-4.tres").write_text(content)
          (cfg_dir / "editor_settings-4.2.tres").write_text(content)
          PYEOF

      - name: Generate Procedural Audio & Stadium Data Bank (>105 MB Uncompressed)
        run: |
          python3 - << 'PYEOF'
          import wave, struct, math, random, os

          os.makedirs("generated_banks", exist_ok=True)

          def make_wav(filename, duration_sec, sample_rate=44100, mode="crowd"):
              num_samples = int(duration_sec * sample_rate)
              with wave.open(filename, "w") as w:
                  w.setnchannels(2)
                  w.setsampwidth(2)
                  w.setframerate(sample_rate)
                  chunk = bytearray()
                  val_l = 0.0
                  val_r = 0.0
                  for i in range(num_samples):
                      t = i / sample_rate
                      if mode == "crowd":
                          noise_l = random.uniform(-1.0, 1.0)
                          noise_r = random.uniform(-1.0, 1.0)
                          val_l = 0.88 * val_l + 0.12 * noise_l
                          val_r = 0.88 * val_r + 0.12 * noise_r
                          swell = 0.65 + 0.30 * math.sin(t * 0.8) * math.cos(t * 0.23)
                          s_l = int(max(-32767, min(32767, val_l * swell * 18000)))
                          s_r = int(max(-32767, min(32767, val_r * swell * 18000)))
                      elif mode == "whistle":
                          env = max(0.0, 1.0 - (t / max(0.01, duration_sec)))
                          trill = 1.0 + 0.04 * math.sin(t * 55.0 * math.pi)
                          sig = math.sin(2.0 * math.pi * 2850.0 * trill * t) * env
                          s_l = int(sig * 22000)
                          s_r = s_l
                      else:
                          env = math.exp(-t * 18.0)
                          freq = 110.0 * math.exp(-t * 12.0) + 42.0
                          sig = math.sin(2.0 * math.pi * freq * t) * env
                          s_l = int(sig * 28000)
                          s_r = s_l
                      chunk += struct.pack("<hh", s_l, s_r)
                      if len(chunk) >= 65536:
                          w.writeframesraw(chunk)
                          chunk.clear()
                  if chunk:
                      w.writeframesraw(chunk)

          make_wav("generated_banks/crowd_ambience.wav", 6.0, 44100, "crowd")
          make_wav("generated_banks/whistle.wav", 0.6, 44100, "whistle")
          make_wav("generated_banks/ball_kick.wav", 0.35, 44100, "kick")

          target_bytes = 108 * 1024 * 1024
          with open("generated_banks/stadium_acoustic_bank.bin", "wb") as f:
              written = 0
              block_size = 1024 * 1024
              while written < target_bytes:
                  f.write(os.urandom(block_size))
                  written += block_size
          PYEOF

      - name: Import Project & Export Signed Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --import || true
          godot --headless --export-debug "Android" build/PenaltyChampions3D.apk
          ls -lh build/PenaltyChampions3D.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PenaltyChampions3D-Android-APK
          path: build/PenaltyChampions3D.apk
          if-no-files-found: error
